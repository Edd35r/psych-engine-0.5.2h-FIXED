name: Buildsus

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    name: buildAndroid
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java 17 (para sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Usando sdkmanager en: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-29" "build-tools;30.0.3"

      - name: Setup Java 11 (para compilar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Haxelib
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.4.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install hxp --quiet

          # Instala una libreria desde git probando varios repos hasta que uno funcione
          git_install() {
            local name="$1"; shift
            for url in "$@"; do
              echo ">>> Probando $name desde $url"
              if haxelib git "$name" "$url" --quiet; then
                echo ">>> OK: $name <- $url"
                return 0
              fi
            done
            echo "::error::No se pudo instalar $name desde ningun repo"
            return 1
          }

          git_install linc_luajit \
            https://github.com/Sirox228/linc_luajit \
            https://github.com/jigsaw-4277821/linc_luajit \
            https://github.com/MAJigsaw77/linc_luajit \
            https://github.com/superpowers04/linc_luajit

          git_install extension-androidtools \
            https://github.com/MAJigsaw77/extension-androidtools \
            https://github.com/jigsaw-4277821/extension-androidtools \
            https://github.com/MaysLastPlay77/extension-androidtools

          git_install extension-webview \
            https://github.com/MatheusSilver/extension-webview \
            https://github.com/MAJigsaw77/extension-webview

          haxelib list

      - name: Patch extension-androidtools (compatibilidad con Gradle de Lime 7.9)
        run: |
          for f in $(find ~/haxelib/extension-androidtools -name build.gradle); do
            echo "=== ANTES: $f"; cat "$f"
            sed -i -E '/^[[:space:]]*namespace[[:space:]]/d' "$f"
            sed -i -E 's/\bcompileSdk[[:space:]]+([0-9]+)/compileSdkVersion \1/; s/\bminSdk[[:space:]]+([0-9]+)/minSdkVersion \1/; s/\btargetSdk[[:space:]]+([0-9]+)/targetSdkVersion \1/' "$f"
            grep -q compileSdkVersion "$f" || sed -i -E '0,/android[[:space:]]*\{/s//android {\n    compileSdkVersion 29/' "$f"
            echo "=== DESPUES: $f"; cat "$f"
          done
          for m in $(find ~/haxelib/extension-androidtools -name AndroidManifest.xml); do
            grep -q 'package=' "$m" || sed -i 's/<manifest/<manifest package="org.haxe.extension.androidtools"/' "$m"
            echo "=== MANIFEST: $m"; cat "$m"
          done

      - name: Create Version Tag
        run: echo "${{ github.run_id }}" > VERSION

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib list
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile
        run: haxelib run lime build android -debug --app-version="4.0.0-${{ github.run_id }}"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android Build
          path: export/**/*.apk
          if-no-files-found: error
